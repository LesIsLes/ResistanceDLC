plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' // [1] Новый ID для необфусцированных версий
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // === КИТАЙСКИЕ ЗЕРКАЛА (ставятся ПЕРВЫМИ) ===
    maven {
        name = "Aliyun"
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        name = "Tencent"
        url = "https://mirrors.tencent.com/nexus/repository/maven-public/"
    }

    // === ОФИЦИАЛЬНЫЕ РЕПОЗИТОРИИ ===
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
    mavenLocal()
}

// ===================== OGG LIBS =====================
configurations {
    oggLibs
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // [2] Строка mappings УДАЛЕНА — в 26.1 игра не обфусцирована

    implementation "net.fabricmc:fabric-loader:${project.loader_version}" // [3] modImplementation -> implementation
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}" // [3] modImplementation -> implementation

    // === OGG-библиотека (вшивается в .jar через jar { from { ... } }) ===
    oggLibs files('libs/java-vorbis-support-1.2.1.jar')
    implementation files('libs/java-vorbis-support-1.2.1.jar')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25 // [4] Java 21 -> 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25 // [4]
    targetCompatibility = JavaVersion.VERSION_25 // [4]
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

    // ✅ Вшиваем OGG-библиотеку (с сохранением META-INF/services — важно для SPI!)
    from {
        configurations.oggLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}